# Vendored, detached (non-workspace) copy of upstream candle-core 0.9.1's
# `src/` (byte-for-byte unmodified - see ../../README-vendor.md for the
# full rationale/regen procedure). This manifest is hand-written (not
# copied) to replace `workspace = true` inheritance with the literal
# dependency specs from candle's own workspace root Cargo.toml at the
# 0.9.1 tag, with exactly ONE substantive change: `intel-mkl-src`'s
# feature is `mkl-dynamic-lp64-iomp` instead of upstream's hardcoded
# `mkl-static-lp64-iomp`, which fixes an `undefined symbol: hgemm_` link
# error (upstream's default static MKL redistribution is missing that
# symbol - see memory-bank/decisions.md for the full investigation).
[package]
name = "candle-core"
version = "0.9.1"
edition = "2021"
description = "Minimalist ML framework."
repository = "https://github.com/huggingface/candle"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
accelerate-src = { version = "0.3.2", optional = true }
byteorder = "1.4.3"
candle-kernels = { version = "0.9.1", optional = true }
candle-metal-kernels = { version = "0.9.1", optional = true }
metal = { version = "0.27.0", features = ["mps"], optional = true }
cudarc = { version = "0.16.1", features = ["std", "cublas", "cublaslt", "curand", "driver", "nvrtc", "f16", "cuda-version-from-build-system", "dynamic-linking"], default-features = false, optional = true }
gemm = { version = "0.17.0", features = ["wasm-simd128-enable"] }
half = { version = "2.5.0", features = ["num-traits", "use-intrinsics", "rand_distr"] }
intel-mkl-src = { version = "0.8.1", features = ["mkl-dynamic-lp64-iomp"], optional = true }
libc = { version = "0.2.147", optional = true }
memmap2 = { version = "0.9.3", features = ["stable_deref_trait"] }
num-traits = "0.2.15"
num_cpus = "1.15.0"
rand = "0.9.0"
rand_distr = "0.5.1"
rayon = "1.7.0"
safetensors = "0.4.1"
thiserror = "1"
ug-cuda = { version = "0.4.0", optional = true }
ug-metal = { version = "0.4.0", optional = true }
yoke = { version = "0.7.2", features = ["derive"] }
zip = { version = "1.1.1", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ug = "0.4.0"

[features]
default = []
cuda = ["cudarc", "dep:candle-kernels", "dep:ug-cuda"]
cudnn = ["cuda", "cudarc/cudnn"]
mkl = ["dep:libc", "dep:intel-mkl-src"]
accelerate = ["dep:libc", "dep:accelerate-src"]
metal = ["dep:metal", "dep:candle-metal-kernels", "dep:ug-metal"]
