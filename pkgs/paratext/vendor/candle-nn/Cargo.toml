# Vendored, detached (non-workspace) copy of upstream candle-nn 0.9.1's
# `src/` - see ../candle-core/Cargo.toml's header comment for the full
# rationale (same treatment applies here: literal deps instead of
# `workspace = true`, `candle` path repointed at our vendored
# candle-core, intel-mkl-src switched to dynamic linking).
[package]
name = "candle-nn"
version = "0.9.1"
edition = "2021"
description = "Minimalist ML framework."
repository = "https://github.com/huggingface/candle"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
accelerate-src = { version = "0.3.2", optional = true }
candle = { package = "candle-core", path = "../candle-core", version = "0.9.1" }
half = "2.5.0"
thiserror = "1"
intel-mkl-src = { version = "0.8.1", features = ["mkl-dynamic-lp64-iomp"], optional = true }
num-traits = "0.2.15"
rayon = "1.7.0"
safetensors = "0.4.1"
serde = { version = "1.0.171", features = ["derive"] }
metal = { version = "0.27.0", features = ["mps"], optional = true }
candle-metal-kernels = { version = "0.9.1", optional = true }

[features]
default = []
accelerate = ["dep:accelerate-src", "candle/accelerate"]
cuda = ["candle/cuda"]
cudnn = ["candle/cudnn"]
mkl = ["dep:intel-mkl-src", "candle/mkl"]
metal = ["candle/metal", "dep:candle-metal-kernels", "dep:metal"]
