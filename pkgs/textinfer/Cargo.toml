[package]
name = "textinfer"
version = "0.1.0"
edition = "2021"

[dependencies]
mistralrs = "0.8.1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
core_affinity = "0.8"
nix = { version = "0.29", features = ["sched"] }

[profile.release]
opt-level = 3
