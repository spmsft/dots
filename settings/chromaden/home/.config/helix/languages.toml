# --- Python Setup ---
[language-server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]

[language-server.ruff]
command = "ruff"
args = ["server", "--preview"]

[[language]]
name = "python"
scope = "source.python"
injection-regex = "python"
file-types = ["py", "pyi", "pyw", "ipynb"]
shebangs = ["python"]
roots = ["pyproject.toml", "setup.py", "poetry.lock", "pyrightconfig.json"]
# We list both here so they run in parallel
language-servers = [ "basedpyright", "ruff" ]
auto-format = true

# --- Markdown Setup ---
[language-server.markdown-oxide]
command = "markdown-oxide"

[[language]]
name = "markdown"
scope = "source.md"
injection-regex = "md|markdown"
file-types = ["md", "markdown"]
roots = [".marksman.json", ".garden", ".obsidian"]
language-servers = [ "markdown-oxide" ]

[[language]]
name = "xml"
language-servers = [ "lemminx" ]
auto-format = true

[language-server.lemminx]
command = "lemminx"

[[language]]
name = "json"
formatter = { command = "prettier", args = ["--parser", "json"] }
auto-format = true

# --- Lean 4 Setup ---
# Wrap Helix's built-in `lake serve` invocation in lean-helix-view's
# transparent proxy, so a `lean-helix-view` side-pane (tmux/zellij, run
# separately from the Lean project root) can show goals/diagnostics -
# Helix itself has no InfoView-equivalent. See
# https://github.com/wyattgill9/lean-helix-view. Requires
# suites.dev-tools.leanHelixView (this repo's Nix packaging of it).
[language-server.lean]
command = "lean-helix-view"
args = ["proxy", "--", "lake", "serve"]

[[language]]
name = "lean"
language-servers = [ "lean" ]
